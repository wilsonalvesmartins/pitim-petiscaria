version: '3.8'

services:
  delivery:
    build: .
    container_name: pitim-delivery-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATA_DIR=/app/data
    volumes:
      - pitim_delivery_data:/app/data

volumes:
  pitim_delivery_data:
    name: pitim_delivery_data
